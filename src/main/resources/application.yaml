spring:
  application:
    name: sfes

  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 1
      connection-timeout: 3000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  threads:
    virtual:
      enabled: true

logging:
  level:
    org:
      hibernate:
        SQL: WARN

jwt:
  expiration: 86400000

bucket:
  limits:
    general:
      capacity: 60
      refill: 20

    login:
      capacity: 30
      refill: 10

    password-reset:
      capacity: 10
      refill: 5