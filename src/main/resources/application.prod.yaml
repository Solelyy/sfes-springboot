cookie:
  secure: 'true'
  sameSite: None

spring:
  datasource:
    username: ${DB_USERNAME}
    url: ${DB_URL}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret: ${JWT_SECRET}

invitation:
  expiration: 172800000

reset-password:
  expiration: 3600000
  cooldown: 3600000

app:
  frontend-url: http://localhost:3000
  email:
    provider: smtp
    from: {MAIL_FROM}

api:
  resend-api-Key: ${RESEND_API_KEY}